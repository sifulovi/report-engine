name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build, test, and package distribution
        run: ./mvnw clean package --batch-mode --no-transfer-progress

      - name: Publish to GitHub Packages
        run: ./mvnw deploy --batch-mode --no-transfer-progress -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            jasper-framework-dist/target/jasper-framework-*.zip
            jasper-framework-core/target/jasper-framework-core-*.jar
            jasper-framework-exporter/target/jasper-framework-exporter-*.jar
            jasper-framework-composition/target/jasper-framework-composition-*.jar
            jasper-framework-registry/target/jasper-framework-registry-*.jar
            jasper-framework-metadata/target/jasper-framework-metadata-*.jar
            jasper-framework-async/target/jasper-framework-async-*.jar
            jasper-framework-storage/target/jasper-framework-storage-*.jar
            jasper-framework-spring/target/jasper-framework-spring-*.jar
            jasper-framework-jakarta/target/jasper-framework-jakarta-*.jar
